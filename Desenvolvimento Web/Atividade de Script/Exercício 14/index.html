<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let nome = window.prompt ("Qual é o seu nome?")
        let idade = window.prompt ("Qual a sua idade?")
        let curso = window.prompt ("Qual o seu curso no Senac?")
        let cidade = window.prompt ("Em qual cidade você mora?")
        console.log (`Meu nome é ${nome}, tenho ${idade} anos, moro na cidade de ${cidade} e faço o curso de ${curso}.`)
    </script>
</body>
</html>
