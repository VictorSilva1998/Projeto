<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        nome = window.prompt ("Qual seu nome?")
        idade = window.prompt ("Qual a sua idade?")
        cidade = window.prompt ("Qual a cidade onde mora?")

        window.alert ("Olá, " + nome + "! Você tem " + idade + " anos e mora em " + cidade + ".")
    </script>
</body>
</html>
