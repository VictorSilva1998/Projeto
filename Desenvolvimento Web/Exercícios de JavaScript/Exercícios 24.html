<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let n1 = prompt ("Digite a nota 1:")
        n1 = parseFloat (n1)
        let n2 = prompt ("Digite a nota 2:")
        n2 = parseFloat (n2)
        let n3 = prompt ("Digite a nota 3:")
        n3 = parseFloat (n3)
        
        resultado = (n1 + n2 + n3) / 3

        alert (`A média das notas é: ${resultado}.`)
    </script>
</body>
</html>
