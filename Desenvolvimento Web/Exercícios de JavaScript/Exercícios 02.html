<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let idade = window.prompt ("Qual a sua idade?")
        idade = parseInt (idade);
        if (idade < 18) {
            window.alert ("Menor de Idade");
        }
        
        else {
            window.alert ("Maior de Idade")
        }
    </script>
</body>
</html>
