<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let soma = 0;
        let numero = 1;

        while (numero <= 100) {
            soma += numero;
            numero++;
        }

        console.log("A soma dos números de 1 até 100 é:", soma);
    </script>
</body>
</html>
