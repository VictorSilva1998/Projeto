<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let media = window.prompt ("Informe a média do aluno:")
        media = parseInt (media);
        if (media > 10) {
            window.alert ("Média Inválida");
        }

        else if (media >= 7) {
            window.alert ("Aluno Aprovado");
        }
        
        else {
            window.alert ("Aluno reprovado")
        }
    </script>
</body>
</html>
