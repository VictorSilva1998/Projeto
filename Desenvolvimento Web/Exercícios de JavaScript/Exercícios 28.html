<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function calcularMedia (a, b, c) {
            return (a + b + c) / 3;
        }

        let valor1 = Number(prompt("Digite a primeiro nota:"));
        let valor2 = Number(prompt("Digite a segundo nota:"));
        let valor3 = Number(prompt("Digite a terceira nota:"));

        let resultado = calcularMedia(valor1, valor2, valor3);

        alert("A média é: " + resultado);
    </script>
</body>
</html>
