<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const palavra = prompt ("Digite uma palavra:")
        const numero = prompt ("Digite um número:")
        const resultado = palavra.repeat (numero)

        alert (`A sua palavra, repitida ${numero} é: ${resultado}.`)
    </script>
</body>
</html>
