<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let senha = prompt("Digite a senha:");

        while (senha !== "1234") {
            senha = prompt("Senha incorreta! Digite a senha novamente:");
        }

        alert("Acesso permitido!");
    </script>
</body>
</html>
