<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const original = prompt ("Digite uma frase:")
        const substituir = prompt ("Digite a palavra que deseja substituir:")
        const nova = prompt ("Digite a nova palavra:")
        const resultado = original.replace (substituir, nova)

        alert (`O sua frase agora é: ${resultado}.`)
    </script>
</body>
</html>
